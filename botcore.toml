# Botcore configuration for the botcore repository itself

language = "python"
linter = "ruff"
test_runner = "pytest"
formatter = "ruff"

# Quality thresholds
file_size_warn = 500
file_size_error = 1000
coverage_threshold = 80
deps_max_major_behind = 1
check_changelog = true
check_agents = true

[skills]
source_dir = ".claude/skills"
